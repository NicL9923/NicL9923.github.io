    <meta name="theme-color" content="#ffffff" />
    <script>
      // Apply the saved or system theme before first paint. Matches
      // next-themes (storage key "theme", class on <html>) in src/Root.tsx and
      // the colors in src/components/controls/ThemeColorMeta.tsx.
      (() => {
        let saved = null;
        try {
          saved = localStorage.getItem('theme');
        } catch {
          // Storage blocked; fall back to the system preference.
        }
        const dark =
          saved === 'dark' ||
          (saved !== 'light' &&
            matchMedia('(prefers-color-scheme: dark)').matches);
        const theme = dark ? 'dark' : 'light';
        document.documentElement.classList.add(theme);
        document.documentElement.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#0d1117' : '#ffffff');
      })();
    </script>
